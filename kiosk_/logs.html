<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>키오스크 관리자 대시보드</title>
    <div style="display:flex; justify-content:center; margin-bottom:20px;">
      <button class="btn gray" onclick="goToKiosk()">
        ⬅ 메뉴 선택 화면으로 돌아가기
      </button>
    </div>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Apple SD Gothic Neo", sans-serif; background: #f3f4f6; margin: 0; padding: 20px; }
    h1 { color: #dc2626; text-align: center; margin-bottom: 20px; }
    
      
    /* 탭 */
    .tab-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: white;
      padding: 8px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      background: #f3f4f6;
      color: #6b7280;
      transition: all 0.2s;
    }
    .tab-btn.active { background: #dc2626; color: white; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 공통 카드/섹션 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .stat-label { color: #6b7280; font-size: 14px; margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 900; color: #dc2626; }
    .stat-value.green { color: #16a34a; }
    .stat-value.blue  { color: #2563eb; }

    .section { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .section h2 { color: #111; margin: 0 0 16px 0; font-size: 18px; }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th { background: #f9fafb; padding: 10px 12px; text-align: left; color: #6b7280; border-bottom: 1px solid #e5e7eb; }
    td { padding: 10px 12px; border-bottom: 1px solid #f3f4f6; }
    tr:hover td { background: #fef2f2; }

    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 12px; font-weight: 700; }
    .badge.success { background: #dcfce7; color: #16a34a; }
    .badge.fail    { background: #fee2e2; color: #dc2626; }
    .badge.open    { background: #dbeafe; color: #2563eb; }
    .badge.closed  { background: #f3f4f6; color: #6b7280; }

    .btn { background: #dc2626; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 700; }
    .btn:hover { background: #b91c1c; }
    .btn:disabled { background: #d1d5db; cursor: not-allowed; }
    .btn.gray   { background: #6b7280; margin-left: 8px; }
    .btn.gray:hover { background: #4b5563; }
    .btn.green  { background: #16a34a; }
    .btn.green:hover { background: #15803d; }

    .step-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .step-card { background: #f9fafb; border-radius: 8px; padding: 12px; text-align: center; }
    .step-name  { font-size: 13px; color: #6b7280; margin-bottom: 6px; }
    .step-rate  { font-size: 22px; font-weight: 900; color: #dc2626; }
    .step-count { font-size: 12px; color: #9ca3af; margin-top: 4px; }

    .empty { text-align: center; color: #9ca3af; padding: 40px; }
    .refresh-time { text-align: right; color: #9ca3af; font-size: 12px; margin-bottom: 12px; }

    /* 개점/마감 탭 스타일 */
    .biz-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    .biz-card {
      background: white;
      border-radius: 12px;
      padding: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      text-align: center;
    }
    .biz-card h3 { font-size: 20px; margin: 0 0 16px 0; }
    .biz-status-banner {
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .biz-status-banner.open   { background: #dbeafe; color: #1d4ed8; }
    .biz-status-banner.closed { background: #f3f4f6; color: #6b7280; }

    .date-input-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
    .date-input-row input[type="date"] {
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      color: #111;
    }
    .date-input-row input[type="date"]:focus { outline: none; border-color: #dc2626; }

    .settlement-result {
      background: #f9fafb;
      border-radius: 10px;
      padding: 20px;
      margin-top: 16px;
      text-align: left;
    }
    .settlement-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #e5e7eb; }
    .settlement-row:last-child { border-bottom: none; }
    .settlement-row .label { color: #6b7280; }
    .settlement-row .value { font-weight: 700; color: #111; }
    .settlement-row .value.big { font-size: 18px; color: #dc2626; }

    .sub-title { font-size: 13px; font-weight: 700; color: #374151; margin: 12px 0 6px 0; }
  </style>
</head>
<body>

<h1>🏪 키오스크 관리자 대시보드</h1>

<!-- 탭 -->
<div class="tab-bar">
  <button class="tab-btn active" onclick="switchTab('bizTab', this)">📅 개점 / 마감</button>
  <button class="tab-btn" onclick="switchTab('orderTab', this)">🧾 주문 내역</button>
  <button class="tab-btn" onclick="switchTab('logTab', this)">🎤 음성인식 로그</button>
</div>


<!-- ======================== 탭1: 개점/마감 ======================== -->
<div id="bizTab" class="tab-content active">

  <div id="bizStatusBanner" class="biz-status-banner closed">
    ⏳ 영업 상태 확인 중...
  </div>

  <div class="biz-grid">
    <!-- 개점 카드 -->
    <div class="biz-card">
      <h3>🌅 개점</h3>
      <p style="color:#6b7280; font-size:14px; margin-bottom:16px;">날짜를 선택하고 개점 버튼을 누르세요</p>
      <div class="date-input-row">
        <input type="date" id="openDateInput" />
        <button class="btn green" id="openBtn" onclick="openDay()">개점하기</button>
      </div>
      <div id="openResult"></div>
    </div>

    <!-- 마감 카드 -->
    <div class="biz-card">
      <h3>🌙 마감</h3>
      <p style="color:#6b7280; font-size:14px; margin-bottom:16px;">오늘 영업을 마감하고 정산 내역을 확인합니다</p>
      <button class="btn" id="closeBtn" onclick="closeDay()">마감 및 정산</button>
      <div id="closeResult"></div>
    </div>
  </div>

  <!-- 정산 이력 -->
  <div class="section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="margin:0;">📊 정산 이력</h2>
      <button class="btn" onclick="loadSettlementHistory()">🔄 새로고침</button>
    </div>
    <div id="settlementTable"><div class="empty">데이터 없음</div></div>
  </div>
</div>


<!-- ======================== 탭2: 주문 내역 ======================== -->
<div id="orderTab" class="tab-content">
  <div class="section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="margin:0;">🧾 주문 내역</h2>
      <button class="btn" onclick="loadOrders()">🔄 새로고침</button>
    </div>
    <div id="orderStatsGrid" class="stats-grid" style="margin-bottom:16px;"></div>
    <div id="orderTable"><div class="empty">데이터 없음</div></div>
  </div>
</div>


<!-- ======================== 탭3: 음성 로그 ======================== -->
<div id="logTab" class="tab-content">
  <div class="refresh-time" id="refreshTime"></div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">총 인식 횟수</div>
      <div class="stat-value blue" id="total">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">성공</div>
      <div class="stat-value green" id="success">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">실패</div>
      <div class="stat-value" id="fail">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">인식률</div>
      <div class="stat-value green" id="rate">-</div>
    </div>
  </div>

  <div class="section">
    <h2>📊 단계별 인식률</h2>
    <div class="step-grid" id="stepGrid">
      <div class="empty">데이터 없음</div>
    </div>
  </div>

  <div class="section">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
      <h2 style="margin:0;">📋 최근 인식 기록</h2>
      <div>
        <button class="btn" onclick="loadLogs()">🔄 새로고침</button>
        <button class="btn gray" onclick="clearLogs()">🗑 초기화</button>
      </div>
    </div>
    <div id="logTable"><div class="empty">데이터 없음</div></div>
  </div>
</div>


<script>
const API = "http://15.164.174.208:8001";
function goToKiosk() {
  window.location.href = "index.html";
}

const STEP_NAMES = {
  restaurant: "식당 선택",
  main: "메인 메뉴",
  side: "사이드",
  drink: "음료",
  confirm: "주문 확인",
  payment: "결제",
};

// ── 탭 전환 ──
function switchTab(tabId, btn) {
  document.querySelectorAll(".tab-content").forEach(t => t.classList.remove("active"));
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");
  btn.classList.add("active");

  if (tabId === "bizTab")   { loadBizStatus(); loadSettlementHistory(); }
  if (tabId === "orderTab") { loadOrders(); }
  if (tabId === "logTab")   { loadLogs(); }
}

// ── 오늘 날짜 기본값 세팅 ──
function setTodayDate() {
  const today = new Date().toISOString().slice(0, 10);
  document.getElementById("openDateInput").value = today;
}


// ============================================================
// 개점 / 마감
// ============================================================

async function loadBizStatus() {
  try {
    const resp = await fetch(`${API}/current-day`);
    const data = await resp.json();
    const banner = document.getElementById("bizStatusBanner");
    const openBtn = document.getElementById("openBtn");
    const closeBtn = document.getElementById("closeBtn");

    if (data.is_open) {
      banner.className = "biz-status-banner open";
      banner.textContent = `✅ 영업 중 | ${data.open_date}` + (data.opened_at ? ` | 개점 시간: ${new Date(data.opened_at).toLocaleTimeString("ko-KR")}` : "");
      openBtn.disabled = true;
      closeBtn.disabled = false;
    } else {
      banner.className = "biz-status-banner closed";
      banner.textContent = "🔒 현재 영업 중이 아닙니다. 개점 후 주문을 시작하세요.";
      openBtn.disabled = false;
      closeBtn.disabled = true;
    }
  } catch (e) {
    document.getElementById("bizStatusBanner").textContent = "❗ 서버 연결 오류";
  }
}

async function openDay() {
  const date = document.getElementById("openDateInput").value;
  if (!date) { alert("날짜를 선택해주세요."); return; }

  const resp = await fetch(`${API}/open-day`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ open_date: date }),
  });
  const data = await resp.json();
  const el = document.getElementById("openResult");

  if (data.success) {
    el.innerHTML = `<div style="margin-top:12px; color:#16a34a; font-weight:700;">✅ ${data.message}</div>`;
    loadBizStatus();
    loadSettlementHistory();
  } else {
    el.innerHTML = `<div style="margin-top:12px; color:#dc2626; font-weight:700;">❌ ${data.message || data.error}</div>`;
  }
}

async function closeDay() {
  if (!confirm("오늘 영업을 마감하고 정산하시겠습니까?")) return;

  const resp = await fetch(`${API}/close-day`, { method: "POST" });
  const data = await resp.json();
  const el = document.getElementById("closeResult");

  if (data.success) {
    const methodLabel = { card: "💳 카드", cash: "💵 현금", qr: "📱 카카오페이" };

    const storeRows = (data.by_store || []).map(s =>
      `<div class="settlement-row"><span class="label">${s.store}</span><span class="value">${s.orders}건 · ${Number(s.revenue).toLocaleString()}원</span></div>`
    ).join("");

    const payRows = (data.by_payment || []).map(p =>
      `<div class="settlement-row"><span class="label">${methodLabel[p.payment_method] || p.payment_method}</span><span class="value">${p.cnt}건 · ${Number(p.revenue).toLocaleString()}원</span></div>`
    ).join("");

    const menuRows = (data.top_menus || []).map((m, i) =>
      `<div class="settlement-row"><span class="label">${i+1}위 ${m.menu_name}</span><span class="value">${m.total_qty}개</span></div>`
    ).join("");

    el.innerHTML = `
      <div class="settlement-result">
        <div class="settlement-row">
          <span class="label">📅 영업일</span>
          <span class="value">${data.open_date}</span>
        </div>
        <div class="settlement-row">
          <span class="label">📦 총 주문</span>
          <span class="value">${data.total_orders}건</span>
        </div>
        <div class="settlement-row">
          <span class="label">💰 총 매출</span>
          <span class="value big">${Number(data.total_revenue).toLocaleString()}원</span>
        </div>
        ${storeRows ? `<div class="sub-title">가게별 매출</div>${storeRows}` : ""}
        ${payRows ? `<div class="sub-title">결제수단별</div>${payRows}` : ""}
        ${menuRows ? `<div class="sub-title">🏆 인기 메뉴 TOP 3</div>${menuRows}` : ""}
      </div>`;
    loadBizStatus();
    loadSettlementHistory();
  } else {
    el.innerHTML = `<div style="margin-top:12px; color:#dc2626; font-weight:700;">❌ ${data.message || data.error}</div>`;
  }
}

async function loadSettlementHistory() {
  try {
    const resp = await fetch(`${API}/settlement-history`);
    const rows = await resp.json();

    if (!rows || rows.length === 0) {
      document.getElementById("settlementTable").innerHTML = '<div class="empty">아직 정산 이력이 없습니다.</div>';
      return;
    }

    document.getElementById("settlementTable").innerHTML = `
      <table>
        <thead>
          <tr>
            <th>날짜</th>
            <th>개점 시간</th>
            <th>마감 시간</th>
            <th>상태</th>
            <th>주문 수</th>
            <th>총 매출</th>
          </tr>
        </thead>
        <tbody>
          ${rows.map(r => `
            <tr>
              <td><strong>${r.open_date}</strong></td>
              <td>${r.opened_at ? new Date(r.opened_at).toLocaleTimeString("ko-KR") : "-"}</td>
              <td>${r.closed_at ? new Date(r.closed_at).toLocaleTimeString("ko-KR") : "-"}</td>
              <td><span class="badge ${r.status === 'open' ? 'open' : 'closed'}">${r.status === 'open' ? '영업 중' : '마감'}</span></td>
              <td>${r.total_orders ?? "-"}건</td>
              <td>${r.total_revenue != null ? Number(r.total_revenue).toLocaleString() + "원" : "-"}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>`;
  } catch (e) {
    document.getElementById("settlementTable").innerHTML = '<div class="empty">서버 연결 오류</div>';
  }
}


// ============================================================
// 주문 내역
// ============================================================

async function loadOrders() {
  try {
    const resp = await fetch(`${API}/orders`);
    const rows = await resp.json();

    if (!rows || rows.length === 0) {
      document.getElementById("orderTable").innerHTML = '<div class="empty">아직 주문이 없습니다.</div>';
      return;
    }

    const ordersMap = {};
    rows.forEach(row => {
      if (!ordersMap[row.order_id]) {
        ordersMap[row.order_id] = {
          order_number: row.order_number,
          store: row.store,
          payment_method: row.payment_method,
          total_price: row.total_price,
          ordered_at: row.ordered_at,
          items: []
        };
      }
      ordersMap[row.order_id].items.push(`${row.menu_name} × ${row.quantity}`);
    });

    const orders = Object.values(ordersMap);
    const totalSales = orders.reduce((s, o) => s + o.total_price, 0);
    const methodLabel = { card: "💳 카드", cash: "💵 현금", qr: "📱 카카오페이" };

    document.getElementById("orderStatsGrid").innerHTML = `
      <div class="stat-card"><div class="stat-label">총 주문 수</div><div class="stat-value blue">${orders.length}건</div></div>
      <div class="stat-card"><div class="stat-label">총 매출</div><div class="stat-value green">${totalSales.toLocaleString()}원</div></div>
    `;

    document.getElementById("orderTable").innerHTML = `
      <table>
        <thead>
          <tr><th>주문번호</th><th>가게</th><th>메뉴</th><th>결제수단</th><th>금액</th><th>시간</th></tr>
        </thead>
        <tbody>
          ${orders.map(o => `
            <tr>
              <td><strong>${o.order_number}번</strong></td>
              <td>${o.store}</td>
              <td>${o.items.join(", ")}</td>
              <td>${methodLabel[o.payment_method] || o.payment_method}</td>
              <td>${o.total_price.toLocaleString()}원</td>
              <td>${new Date(o.ordered_at).toLocaleString("ko-KR")}</td>
            </tr>
          `).join("")}
        </tbody>
      </table>`;
  } catch (e) {
    document.getElementById("orderTable").innerHTML = '<div class="empty">서버 연결 오류</div>';
  }
}


// ============================================================
// 음성 로그
// ============================================================

async function loadLogs() {
  try {
    const resp = await fetch(`${API}/logs`);
    const data = await resp.json();

    document.getElementById("refreshTime").textContent =
      "마지막 업데이트: " + new Date().toLocaleTimeString("ko-KR");

    if (data.message === "로그 없음") {
      document.getElementById("total").textContent = "0";
      document.getElementById("success").textContent = "0";
      document.getElementById("fail").textContent = "0";
      document.getElementById("rate").textContent = "0%";
      document.getElementById("stepGrid").innerHTML = '<div class="empty">아직 데이터가 없어요. 테스트해보세요!</div>';
      document.getElementById("logTable").innerHTML = '<div class="empty">아직 데이터가 없어요. 테스트해보세요!</div>';
      return;
    }

    const stats = data.stats;
    document.getElementById("total").textContent = stats["총횟수"];
    document.getElementById("success").textContent = stats["성공"];
    document.getElementById("fail").textContent = stats["실패"];
    document.getElementById("rate").textContent = stats["인식률"];

    const stepStats = stats["단계별"];
    if (stepStats && Object.keys(stepStats).length > 0) {
      document.getElementById("stepGrid").innerHTML = Object.entries(stepStats)
        .map(([step, counts]) => {
          const total = (counts["성공"] || 0) + (counts["실패"] || 0);
          const rate  = total > 0 ? Math.round((counts["성공"] || 0) / total * 100) : 0;
          return `
            <div class="step-card">
              <div class="step-name">${STEP_NAMES[step] || step}</div>
              <div class="step-rate">${rate}%</div>
              <div class="step-count">성공 ${counts["성공"] || 0} / 실패 ${counts["실패"] || 0}</div>
            </div>`;
        }).join("");
    }

    const logs = data.logs;
    if (logs && logs.length > 0) {
      document.getElementById("logTable").innerHTML = `
        <table>
          <thead>
            <tr>
              <th>시간</th><th>단계</th><th>인식된 텍스트</th><th>전처리 텍스트</th><th>결과</th><th>AI 응답</th>
            </tr>
          </thead>
          <tbody>
            ${[...logs].reverse().map(log => `
              <tr>
                <td>${log["시간"]}</td>
                <td>${STEP_NAMES[log["단계"]] || log["단계"]}</td>
                <td>${log["원본텍스트"] || "-"}</td>
                <td>${log["전처리텍스트"] || "-"}</td>
                <td><span class="badge ${log["인식성공"] === "성공" ? "success" : "fail"}">${log["인식성공"]}</span></td>
                <td>${log["AI응답"] || "-"}</td>
              </tr>`).join("")}
          </tbody>
        </table>`;
    }
  } catch (err) {
    document.getElementById("logTable").innerHTML = '<div class="empty">서버 연결 오류. 서버가 실행 중인지 확인해주세요.</div>';
  }
}

async function clearLogs() {
  if (!confirm("로그를 초기화하시겠습니까?")) return;
  await fetch(`${API}/logs`, { method: "DELETE" });
  loadLogs();
}


// ── 초기 로드 ──
setTodayDate();
loadBizStatus();
loadSettlementHistory();
setInterval(loadBizStatus, 30000);
</script>
